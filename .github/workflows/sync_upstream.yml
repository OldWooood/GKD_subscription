name: sync_upstream

# 说明：本 fork 只备份规则，不跟进上游的 CI 改动。
# 合并时会自动把 .github/workflows/ 恢复成本仓库版本（需要时可手动合并上游的 workflow），
# 因此推送的提交不含 workflow 文件，用默认 GITHUB_TOKEN 即可，无需 PAT。

on:
  schedule:
    # 每天 UTC 03:17 / 15:17（北京时间 11:17 / 23:17）自动同步一次
    # 避开整点高峰，并避开上游 19:00 UTC 的构建时间
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync_upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 获取上游仓库最新提交
        run: |
          git remote add upstream https://github.com/Lin-arm/GKD_subscription.git
          git fetch upstream main

      - name: 合并上游提交
        id: merge
        run: |
          set -euo pipefail
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git config --local user.name github-actions[bot]
          # 上游已是当前历史的一部分（完全一致或本地领先），无需同步，
          # 避免产生多余的合并提交
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已包含上游提交，无需同步"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          if ! git merge -m 'chore: sync upstream/main' upstream/main; then
            echo '::error::合并冲突，需人工处理'
            git merge --abort || true
            exit 1
          fi
          # 本 fork 只备份规则：workflows 固定用本仓库版本，
          # 上游的 CI 改动不同步（需要时可手动合并）。
          # 这样推送的提交不含 workflow 文件，GITHUB_TOKEN 就够用，无需 PAT。
          if ! git diff --quiet "$before" HEAD -- .github/workflows/; then
            git rm -q -r .github/workflows/
            git checkout "$before" -- .github/workflows/
            git commit --amend --no-edit
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送同步结果
        if: ${{ steps.merge.outputs.changed == 'true' }}
        run: git push origin main
