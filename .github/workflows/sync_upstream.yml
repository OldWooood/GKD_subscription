name: sync_upstream

on:
  schedule:
    # 每天 UTC 03:17 / 15:17（北京时间 11:17 / 23:17）自动同步一次
    # 避开整点高峰，并避开上游 19:00 UTC 的构建时间
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync_upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 获取上游仓库最新提交
        run: |
          git remote add upstream https://github.com/Lin-arm/GKD_subscription.git
          git fetch upstream main

      - name: 合并上游提交
        id: merge
        run: |
          if git diff --quiet HEAD upstream/main; then
            echo "已与上游一致，无需同步"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git config --local user.name github-actions[bot]
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 推送同步结果
        if: ${{ steps.merge.outputs.changed == 'true' }}
        run: git push origin main
